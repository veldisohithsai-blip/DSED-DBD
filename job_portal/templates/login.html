{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="container">
  <div class="auth-wrap">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to your SkillBridge account.</p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>

    <div class="panel" style="margin-top:24px; background:var(--bg);">
      <p style="margin:0; font-size:0.82rem; color:var(--muted);">
        <strong>Demo accounts</strong> &middot; Job seeker: john.doe@example.com / password123
        &middot; Recruiter: ananya.rao@technova.com / password123
      </p>
    </div>
  </div>
</div>
{% endblock %}
