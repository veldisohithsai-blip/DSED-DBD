{% extends "base.html" %}
{% block title %}Edit job{% endblock %}
{% block content %}
<div class="container">
  <div class="form-wide">
    <h1>Edit job</h1>
    <p class="auth-sub">Update your posting. Changes are saved directly to the SQLite database.</p>
    <form method="POST" action="{{ url_for('edit_job', job_id=job['job_id']) }}">
      <div class="field"><label for="title">Job title</label><input type="text" id="title" name="title" value="{{ job['title'] }}" required></div>
      <div class="grid-2">
        <div class="field"><label for="company">Company name</label><input type="text" id="company" name="company" value="{{ job['company'] }}"></div>
        <div class="field"><label for="location">Location</label><input type="text" id="location" name="location" value="{{ job['location'] }}" required></div>
      </div>
      <div class="grid-2">
        <div class="field"><label for="job_type">Job type</label><select id="job_type" name="job_type" required>{% for jt in ['Full-time','Part-time','Internship','Remote'] %}<option value="{{ jt }}" {{ 'selected' if jt == job['job_type'] }}>{{ jt }}</option>{% endfor %}</select></div>
        <div class="field"><label for="salary_range">Salary range</label><input type="text" id="salary_range" name="salary_range" value="{{ job['salary_range'] or '' }}"></div>
      </div>
      <div class="field"><label for="description">Job description</label><textarea id="description" name="description" required>{{ job['description'] }}</textarea></div>
      <div class="field"><label for="skills_required">Required skills (comma-separated)</label><input type="text" id="skills_required" name="skills_required" value="{{ job['skills_required'] }}" required></div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn-accent">Save changes</button>
        <a href="{{ url_for('recruiter_dashboard') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
